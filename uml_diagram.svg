<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="generalization" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <polygon points="0 0, 14 7, 0 14" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    </marker>
    <marker id="realization" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <polygon points="0 0, 14 7, 0 14" fill="#ffffff" stroke="#059669" stroke-width="2" />
    </marker>
    <marker id="dependency" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polyline points="0 0, 9 5, 0 10" fill="none" stroke="#64748b" stroke-width="1.8" />
    </marker>
    <marker id="composition" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto">
      <polygon points="0 7, 7 0, 14 7, 7 14" fill="#1e293b" stroke="#1e293b" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Title & Legend -->
  <rect x="20" y="15" width="960" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="35" y="41" font-size="16" font-weight="700" fill="#0f172a">Visitor Pattern Architecture: Advanced File System Model</text>
  <text x="640" y="41" font-size="12" fill="#64748b">Astana IT University | Muratbek Akyl (SE 2523)</text>

  <!-- ================= ELEMENT HIERARCHY (LEFT SIDE) ================= -->

  <!-- Element Interface -->
  <g transform="translate(40, 80)" filter="url(#card-shadow)">
    <rect width="360" height="150" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <path d="M 0 0 L 360 0 L 360 40 L 0 40 Z" fill="#ecfdf5" rx="6"/>
    <rect y="34" width="360" height="6" fill="#ecfdf5"/>
    <text x="180" y="20" text-anchor="middle" font-size="11" font-style="italic" fill="#047857" font-weight="600">&lt;&lt;interface&gt;&gt;</text>
    <text x="180" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Element</text>
    <line x1="0" y1="40" x2="360" y2="40" stroke="#059669" stroke-width="1.5"/>
    
    <!-- Methods -->
    <text x="15" y="62" font-size="12" fill="#0f172a">+ getName(): String</text>
    <text x="15" y="82" font-size="12" fill="#0f172a">+ getParent(): DirectoryNode</text>
    <text x="15" y="102" font-size="12" fill="#0f172a">+ setParent(parent: DirectoryNode): void</text>
    <text x="15" y="124" font-size="12" font-weight="600" fill="#2563eb">+ accept(visitor: Visitor): void</text>
  </g>

  <!-- FileNode Class -->
  <g transform="translate(30, 290)" filter="url(#card-shadow)">
    <rect width="210" height="200" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 L 210 0 L 210 32 L 0 32 Z" fill="#f1f5f9" rx="6"/>
    <rect y="26" width="210" height="6" fill="#f1f5f9"/>
    <text x="105" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">FileNode</text>
    <line x1="0" y1="32" x2="210" y2="32" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Attributes -->
    <text x="12" y="50" font-size="11" fill="#475569">- name: String</text>
    <text x="12" y="68" font-size="11" fill="#475569">- size: long</text>
    <text x="12" y="86" font-size="11" fill="#475569">- parent: DirectoryNode</text>
    <line x1="0" y1="96" x2="210" y2="96" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Methods -->
    <text x="12" y="114" font-size="11" fill="#0f172a">+ getSize(): long</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">+ setSize(size: long): void</text>
    <text x="12" y="150" font-size="11" fill="#0f172a">+ getName(): String</text>
    <text x="12" y="168" font-size="11" fill="#0f172a">+ getParent(): DirectoryNode</text>
    <text x="12" y="186" font-size="11" font-weight="700" fill="#2563eb">+ accept(visitor: Visitor): void</text>
  </g>

  <!-- DirectoryNode Class -->
  <g transform="translate(260, 290)" filter="url(#card-shadow)">
    <rect width="230" height="230" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 L 230 0 L 230 32 L 0 32 Z" fill="#f1f5f9" rx="6"/>
    <rect y="26" width="230" height="6" fill="#f1f5f9"/>
    <text x="115" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">DirectoryNode</text>
    <line x1="0" y1="32" x2="230" y2="32" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Attributes -->
    <text x="12" y="50" font-size="11" fill="#475569">- name: String</text>
    <text x="12" y="68" font-size="11" fill="#475569">- parent: DirectoryNode</text>
    <text x="12" y="86" font-size="11" fill="#475569">- children: List&lt;Element&gt;</text>
    <line x1="0" y1="96" x2="230" y2="96" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Methods -->
    <text x="12" y="114" font-size="11" fill="#0f172a">+ getChildren(): List&lt;Element&gt;</text>
    <text x="12" y="132" font-size="11" fill="#0f172a">+ addChild(c: Element): void</text>
    <text x="12" y="150" font-size="11" fill="#0f172a">+ removeChild(c: Element): bool</text>
    <text x="12" y="168" font-size="11" fill="#0f172a">+ findChild(name: String): Opt</text>
    <text x="12" y="186" font-size="11" fill="#0f172a">+ getName(): String</text>
    <text x="12" y="206" font-size="11" font-weight="700" fill="#2563eb">+ accept(visitor: Visitor): void</text>
  </g>

  <!-- Realization arrows from FileNode & DirectoryNode to Element -->
  <path d="M 135 290 L 135 250 L 170 250 L 170 230" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#realization)"/>
  <path d="M 375 290 L 375 250 L 260 250 L 260 230" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#realization)"/>

  <!-- Composite Self-Association: DirectoryNode has children: List<Element> -->
  <path d="M 490 340 L 520 340 L 520 160 L 400 160" fill="none" stroke="#1e293b" stroke-width="1.5" marker-start="url(#composition)"/>
  <text x="505" y="245" font-size="10" font-weight="600" fill="#1e293b" transform="rotate(-90, 505, 245)">children 0..*</text>

  <!-- ================= VISITOR HIERARCHY (RIGHT SIDE) ================= -->

  <!-- Visitor Interface -->
  <g transform="translate(580, 80)" filter="url(#card-shadow)">
    <rect width="380" height="130" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 0 0 L 380 0 L 380 40 L 0 40 Z" fill="#eff6ff" rx="6"/>
    <rect y="34" width="380" height="6" fill="#eff6ff"/>
    <text x="190" y="20" text-anchor="middle" font-size="11" font-style="italic" fill="#1d4ed8" font-weight="600">&lt;&lt;interface&gt;&gt;</text>
    <text x="190" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Visitor</text>
    <line x1="0" y1="40" x2="380" y2="40" stroke="#2563eb" stroke-width="1.5"/>
    
    <!-- Methods -->
    <text x="15" y="65" font-size="12" font-weight="600" fill="#0f172a">+ visit(file: FileNode): void</text>
    <text x="15" y="90" font-size="12" font-weight="600" fill="#0f172a">+ visit(directory: DirectoryNode): void</text>
    <text x="15" y="112" font-size="10" fill="#64748b" font-style="italic">// Overloaded methods handle primary element dispatch</text>
  </g>

  <!-- Concrete Visitor 1: TotalSizeVisitor -->
  <g transform="translate(540, 270)" filter="url(#card-shadow)">
    <rect width="200" height="160" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 L 200 0 L 200 30 L 0 30 Z" fill="#f8fafc" rx="6"/>
    <rect y="24" width="200" height="6" fill="#f8fafc"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">TotalSizeVisitor</text>
    <line x1="0" y1="30" x2="200" y2="30" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="10" y="48" font-size="10" fill="#475569">- totalSize: long</text>
    <line x1="0" y1="56" x2="200" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="10" y="74" font-size="10" fill="#0f172a">+ visit(f: FileNode): void</text>
    <text x="10" y="92" font-size="10" fill="#0f172a">+ visit(d: DirectoryNode): void</text>
    <text x="10" y="112" font-size="10" font-weight="600" fill="#047857">+ getTotalSize(): long</text>
    <text x="10" y="130" font-size="10" fill="#475569">+ reset(): void</text>
    <text x="10" y="148" font-size="9" fill="#64748b" font-style="italic">[R3 Subtree Accumulation]</text>
  </g>

  <!-- Concrete Visitor 2: SearchVisitor -->
  <g transform="translate(760, 270)" filter="url(#card-shadow)">
    <rect width="215" height="195" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <path d="M 0 0 L 215 0 L 215 30 L 0 30 Z" fill="#f8fafc" rx="6"/>
    <rect y="24" width="215" height="6" fill="#f8fafc"/>
    <text x="107" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">SearchVisitor</text>
    <line x1="0" y1="30" x2="215" y2="30" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="10" y="46" font-size="10" fill="#475569">- criterion: Predicate&lt;String&gt;</text>
    <text x="10" y="60" font-size="10" fill="#475569">- minSizeThreshold: long</text>
    <text x="10" y="74" font-size="10" fill="#475569">- matchingPaths: List&lt;String&gt;</text>
    <text x="10" y="88" font-size="10" fill="#475569">- pathStack: Deque&lt;String&gt;</text>
    <line x1="0" y1="94" x2="215" y2="94" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="10" y="110" font-size="10" fill="#0f172a">+ visit(f: FileNode): void</text>
    <text x="10" y="126" font-size="10" fill="#0f172a">+ visit(d: DirectoryNode): void</text>
    <text x="10" y="144" font-size="10" font-weight="600" fill="#047857">+ getMatchingPaths(): List</text>
    <text x="10" y="160" font-size="10" fill="#475569">+ reset(): void</text>
    <text x="10" y="178" font-size="9" fill="#64748b" font-style="italic">[R4 Deterministic Root-Rel]</text>
  </g>

  <!-- Concrete Visitor 3: StatisticsVisitor (Extension Boundary R8) -->
  <g transform="translate(630, 485)" filter="url(#card-shadow)">
    <rect width="250" height="145" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <path d="M 0 0 L 250 0 L 250 30 L 0 30 Z" fill="#f5f3ff" rx="6"/>
    <rect y="24" width="250" height="6" fill="#f5f3ff"/>
    <text x="125" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">StatisticsVisitor (R8 Extension)</text>
    <line x1="0" y1="30" x2="250" y2="30" stroke="#ddd6fe" stroke-width="1"/>
    
    <text x="10" y="46" font-size="10" fill="#475569">- fileCount, directoryCount, maxDepth: int</text>
    <line x1="0" y1="52" x2="250" y2="52" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="10" y="68" font-size="10" fill="#0f172a">+ visit(f: FileNode): void | visit(d: DirNode): void</text>
    <text x="10" y="86" font-size="10" font-weight="600" fill="#047857">+ getFileCount(), getDirectoryCount(): int</text>
    <text x="10" y="104" font-size="10" font-weight="600" fill="#047857">+ getMaxDepth(): int [root depth = 0]</text>
    <text x="10" y="122" font-size="10" fill="#475569">+ reset(): void</text>
    <text x="10" y="138" font-size="9" fill="#7c3aed" font-style="italic">[Added without modifying any Element class]</text>
  </g>

  <!-- Realization arrows from Visitors to Visitor Interface -->
  <path d="M 640 270 L 640 235 L 720 235 L 720 210" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#realization)"/>
  <path d="M 870 270 L 870 235 L 800 235 L 800 210" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#realization)"/>
  <path d="M 755 485 L 755 210" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#realization)"/>

  <!-- Double Dispatch Interaction Annotation (Element.accept -> Visitor.visit) -->
  <path d="M 400 130 L 580 130" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#dependency)"/>
  <rect x="430" y="108" width="120" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="490" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">accept(Visitor)</text>

  <path d="M 580 160 L 400 160" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#dependency)"/>
  <rect x="425" y="165" width="130" height="20" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="490" y="179" text-anchor="middle" font-size="9" font-weight="700" fill="#047857">visitor.visit(this)</text>
</svg>